name: Render Keep-Alive Poke Bot

on:
  schedule:
    # Runs every 5 minutes — GitHub may throttle/skip some runs, but shorter
    # interval maximizes the chance at least one run lands within Render's
    # 15-minute inactivity window. This is a BACKUP layer; primary keep-alive
    # is handled by external uptime monitors (UptimeRobot, Cron-Job.org).
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions dashboard
  push:
    branches:
      - main
      - master

# IMPORTANT: No concurrency group! Cron-triggered runs were getting cancelled
# by push events or by each other due to cancel-in-progress: true

jobs:
  poke:
    name: Poke Render Services
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Don't let failures accumulate — GitHub throttles/delays cron after repeated failures
    continue-on-error: true

    steps:
      - name: 🏓 Ping Backend
        run: |
          echo "⚡ Pinging backend at $(date -u)"
          # Send wake-up request with generous timeout for cold-start
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 \
            -H "User-Agent: Render-KeepAlive-Bot/1.0" \
            "https://resutailor-backend-dev.onrender.com/" \
            || echo "000")
          echo "Response: HTTP $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "✅ Backend is awake!"
          else
            echo "⚠️ Backend returned HTTP $STATUS — external monitors will retry."
          fi

      - name: 🏓 Ping Frontend
        run: |
          echo "⚡ Pinging frontend at $(date -u)"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 \
            -H "User-Agent: Render-KeepAlive-Bot/1.0" \
            "https://resutailor-frontend-dev.onrender.com/sign-in" \
            || echo "000")
          echo "Response: HTTP $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "✅ Frontend is awake!"
          else
            echo "⚠️ Frontend returned HTTP $STATUS — external monitors will retry."
          fi

  # Prevent GitHub from disabling the scheduled workflow due to repo inactivity
  # GitHub disables cron schedules after 60 days with no repo activity
  keep-cron-alive:
    name: Keep Cron Schedule Active
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: 🔄 Keep repository active
        run: |
          # Check if last commit is older than 50 days
          LAST_COMMIT_DATE=$(git log -1 --format=%ct)
          CURRENT_DATE=$(date +%s)
          DAYS_SINCE=$((($CURRENT_DATE - $LAST_COMMIT_DATE) / 86400))
          echo "Days since last commit: $DAYS_SINCE"
          if [ "$DAYS_SINCE" -gt 50 ]; then
            echo "⚠️ Repository approaching 60-day inactivity limit. Creating keep-alive commit..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            date -u > .github/.keep-alive
            git add .github/.keep-alive
            git commit -m "chore: keep-alive commit to prevent workflow schedule deactivation [skip ci]"
            git push
          else
            echo "✅ Repository is active ($DAYS_SINCE days since last commit)"
          fi
